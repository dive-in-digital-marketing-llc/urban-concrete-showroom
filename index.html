<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<title>Urban Showroom — Baltz &amp; Sons Concrete</title>
<meta name="description" content="Every project on a map. Describe the work you want and see the closest one we built, with photos, before-and-afters and how far away it is.">
<meta name="theme-color" content="#12100E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Showroom">
<meta name="robots" content="noindex,nofollow">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/logo.webp" type="image/webp">
<link rel="apple-touch-icon" href="img/icon-180.png">

<!-- Fraunces / Inter / Barlow Condensed — the three faces the website uses. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap">

<!-- Leaflet is vendored, not pulled from a CDN. A contractor opens this on a
     job site with one bar of signal, or on a client's locked-down wifi; a
     blocked CDN must not be able to take the app down. -->
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<!-- ======================================================================
     splash — covers the moment before the first paint, so the app never
     opens on a grey rectangle in front of a customer
     ====================================================================== -->
<div class="splash" id="splash">
  <div>
    <img src="img/logo.webp" alt="" width="320" height="192">
    <div class="nm">Urban Showroom</div>
    <div class="sb" id="splashSub">Baltz &amp; Sons · Est. 1945</div>
    <div class="bar"><i></i></div>
  </div>
</div>

<div class="app">

  <!-- the map lives underneath everything -->
  <div class="mapwrap" id="mapPane" role="tabpanel" aria-labelledby="vsMap">
    <div id="map" role="application" aria-label="Map of completed projects"></div>
  </div>

  <!-- the photo grid and the before/after wall sit in the same space -->
  <div class="viewpane" id="gridPane" role="tabpanel" aria-labelledby="vsGrid" hidden>
    <div class="grid" id="grid"></div>
  </div>
  <div class="viewpane" id="pairsPane" role="tabpanel" aria-labelledby="vsPairs" hidden>
    <div class="pairwall" id="pairWall"></div>
  </div>

  <!-- ====================================================================
       top bar
       ==================================================================== -->
  <header class="topbar">
    <button class="brand" id="brandBtn" type="button" aria-label="About this showroom">
      <img src="img/logo.webp" alt="" width="320" height="192" id="brandLogo">
      <span class="brand-txt">
        <span class="brand-name" id="brandName">Urban Showroom</span>
        <span class="brand-sub" id="brandSub">Baltz &amp; Sons · Est. 1945</span>
      </span>
    </button>
    <div class="topbar-sp"></div>

    <button class="icon-btn" id="btnLocate" type="button" aria-pressed="false" aria-label="Use my location">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3.4"/><path d="M12 2v3.2M12 18.8V22M2 12h3.2M18.8 12H22"/>
        <circle cx="12" cy="12" r="8.4"/>
      </svg>
    </button>

    <button class="icon-btn" id="btnAdd" type="button" aria-label="Add photos or a project" hidden>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>

    <button class="icon-btn" id="btnOwner" type="button" aria-pressed="false" aria-label="Contractor tools">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="4" y="10.5" width="16" height="10.5" rx="2"/>
        <path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/>
      </svg>
    </button>
  </header>

  <!-- ====================================================================
       search
       ==================================================================== -->
  <div class="searchwrap">
    <div class="searchbar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"
           stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      <label class="sr" for="q">Describe the work you want</label>
      <input id="q" type="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
             enterkeyhint="search" placeholder="Stamped &amp; colored driveway…">
      <button class="search-clear" id="searchClear" type="button" aria-label="Clear search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <button class="search-go" id="searchGo" type="button">Show</button>
    </div>
    <div class="parsed" id="parsed" aria-live="polite"></div>
  </div>

  <!-- view switcher + example chips share a scrolling row -->
  <div class="railrow">
    <div class="viewswitch" role="tablist" aria-label="How to view the results">
      <button class="vs on" id="vsMap" type="button" role="tab" aria-selected="true"
              aria-controls="mapPane" data-view="map">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 3L3 5.5v15L9 18l6 3 6-2.5v-15L15 6 9 3z"/><path d="M9 3v15M15 6v15"/>
        </svg>Map
      </button>
      <button class="vs" id="vsGrid" type="button" role="tab" aria-selected="false"
              aria-controls="gridPane" data-view="grid">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="7.5" height="7.5" rx="1"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1"/>
          <rect x="3" y="13.5" width="7.5" height="7.5" rx="1"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1"/>
        </svg><span class="lbl-long">Gallery</span><span class="lbl-short">Photos</span>
      </button>
      <button class="vs" id="vsPairs" type="button" role="tab" aria-selected="false"
              aria-controls="pairsPane" data-view="pairs">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="5" width="8" height="14" rx="1"/><rect x="13" y="5" width="8" height="14" rx="1"/>
        </svg><span class="lbl-long">Before / After</span><span class="lbl-short">Compare</span>
      </button>
    </div>
    <button class="vs sets" id="btnSets" type="button">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/>
      </svg>Sets
    </button>
    <div class="chips" id="chips"></div>
  </div>

  <!-- the curated set a contractor opened for one customer -->
  <div class="collbar" id="collBar" hidden>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/>
    </svg>
    <span class="cb-name" id="collBarName"></span>
    <span class="cb-n" id="collCount"></span>
    <button class="cb-x" id="collClear" type="button" aria-label="Leave this set and show everything">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"
           stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>

  <!-- ====================================================================
       notices
       ==================================================================== -->
  <div class="notice" id="demoBanner" hidden>
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
         stroke-linecap="round" aria-hidden="true"><path d="M12 8.5v5M12 17h.01"/><circle cx="12" cy="12" r="9.2"/></svg>
    <span><b>Sample projects.</b> Real Baltz &amp; Sons photographs, approximate locations. Your own jobs replace these.</span>
    <button id="demoDismiss" type="button" aria-label="Dismiss">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"
           stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>

  <div class="notice warn" id="storageBanner" hidden>
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
         stroke-linecap="round" aria-hidden="true"><path d="M12 8.5v5M12 17h.01"/><circle cx="12" cy="12" r="9.2"/></svg>
    <span id="storageMsg"></span>
    <button id="storageDismiss" type="button" aria-label="Dismiss">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"
           stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>

  <!-- ====================================================================
       result sheet (map view)
       ==================================================================== -->
  <section class="sheet" id="sheet" aria-label="Matching projects">
    <div class="sheet-grab" id="sheetGrab" role="button" tabindex="0"
         aria-expanded="false" aria-label="Expand or collapse the result list"></div>
    <div class="sheet-head">
      <span class="sheet-count" id="sheetCount">—</span>
      <span class="sheet-sub" id="sheetSub"></span>
      <button class="sheet-act" id="btnSaveCollection" type="button" hidden>Save set</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <!-- ====================================================================
       project detail
       ==================================================================== -->
  <section class="detail" id="detail" role="dialog" aria-modal="true"
           aria-hidden="true" aria-label="Project detail">
    <div class="detail-bar">
      <button class="icon-btn" id="dClose" type="button" aria-label="Back">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="topbar-sp"></div>
      <button class="icon-btn" id="dEdit" type="button" aria-label="Edit this project" hidden>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/>
        </svg>
      </button>
    </div>
    <div class="detail-scroll" id="detailScroll">
      <div class="gal">
        <div class="gal-track" id="galTrack"></div>
        <div class="gal-dots" id="galDots"></div>
        <span class="gal-count" id="galCount"></span>
      </div>
      <div class="detail-body">
        <div class="detail-eyebrow" id="dEyebrow"></div>
        <h2 id="dTitle"></h2>
        <p class="detail-lede" id="dLede"></p>
        <div class="distrow" id="dDist"></div>
        <div id="dPairs"></div>
        <div class="spec" id="dSpec"></div>
        <div class="btn-row" id="dActions"></div>
        <div id="dStages"></div>
      </div>
    </div>
  </section>

  <!-- ====================================================================
       before / after presentation mode
       ==================================================================== -->
  <section class="compare" id="compare" role="dialog" aria-modal="true"
           aria-hidden="true" aria-label="Before and after">
    <div class="detail-bar">
      <button class="icon-btn" id="cClose" type="button" aria-label="Close">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <div class="topbar-sp"></div>
      <span class="cmp-title" id="cTitle"></span>
    </div>
    <div class="cmp-stage" id="cStage">
      <img id="cAfter" alt="After" draggable="false">
      <div class="cmp-clip" id="cClip"><img id="cBefore" alt="Before" draggable="false"></div>
      <div class="cmp-handle" id="cHandle" role="slider" tabindex="0" aria-label="Drag to compare before and after"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"><i></i></div>
      <span class="cmp-tag left">Before</span>
      <span class="cmp-tag right">After</span>
    </div>
    <div class="cmp-foot" id="cFoot"></div>
  </section>

  <!-- ====================================================================
       modal — contractor flows
       ==================================================================== -->
  <div class="modal" id="modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-panel">
      <div class="modal-head">
        <h3 id="modalTitle">—</h3>
        <button class="icon-btn" id="modalClose" type="button" aria-label="Close">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
               stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot" id="modalFoot"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<input type="file" id="photoInput" accept="image/*" multiple class="sr" tabindex="-1">
<input type="file" id="importInput" accept="application/json,.json" class="sr" tabindex="-1">

<script src="vendor/leaflet/leaflet.js"></script>
<script src="assets/taxonomy.js"></script>
<script src="assets/geo.js"></script>
<script src="assets/exif.js"></script>
<script src="assets/imaging.js"></script>
<script src="assets/store.js"></script>
<script src="assets/intel.js"></script>
<script src="assets/search.js"></script>
<script src="assets/map.js"></script>
<script src="assets/ui.js"></script>
<script src="assets/owner.js"></script>
<script src="assets/app.js"></script>
</body>
</html>

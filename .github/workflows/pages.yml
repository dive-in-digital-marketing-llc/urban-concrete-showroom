# Publish the Showroom to GitHub Pages.
#
# configure-pages with `enablement: true` turns Pages on via the API using the
# workflow's own token, so nobody has to click through Settings first — that is
# the whole reason this file exists rather than a Settings → Pages click.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # The whole repo IS the site — index.html sits at the root and every path
      # in the app is relative, so it works at /urban-concrete-showroom/ and at
      # a bare custom domain with no edits.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4
